name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://factory:factory@localhost:5432/factory
      TEST_DATABASE_URL: postgresql+psycopg://factory:factory@localhost:5432/factory_test
      APP_SECRET_KEY: ci-secret-no-sensible
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dependencias
        run: uv sync --frozen
      # Los tests de Ollama y GitHub reales se saltan: sus marcadores solo se activan con OLLAMA_REAL/GITHUB_REAL.
      - name: Tests
        run: uv run pytest -q

  dashboard:
    name: Dashboard (lint + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npx tsc --noEmit
