[project]
name = "ai-factory-api"
version = "0.1.0"
description = "Hub de AI Factory: API FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ollama_real: llama al Ollama real; se salta salvo OLLAMA_REAL=1",
    "github_real: llama a github.com/maavcrusoe/meme-demo; se salta salvo GITHUB_REAL=1",
]
